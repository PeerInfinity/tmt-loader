<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tmt-loader</title>
<style>
  #picker { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #ddd; }
  #picker h1 { font-size: 1.4rem; }
  #picker ul { list-style: none; padding: 0; }
  #picker li { border: 1px solid #444; border-radius: 6px; padding: .6rem .9rem; margin: .6rem 0; }
  #picker a { color: #8cf; font-size: 1.1rem; }
  #picker .meta { font-size: .85rem; color: #aaa; margin: .2rem 0 .4rem; }
  #picker button { font-size: .8rem; }
  body.tmt-loader-picker { background: #111; margin: 0; }
</style>
</head>
<body class="tmt-loader-picker">
<div id="picker" hidden>
  <h1>tmt-loader</h1>
  <p>The Modding Tree games, each on its own engine. Saves are kept per game in this browser.</p>
  <ul></ul>
</div>
<script type="module">
  // an absolute URL computed from location.href: the page may be served from any sub-path
  import(new URL('loader/page.js', location.href).href);
</script>
</body>
</html>
