# THE QUIRK-RATE MEASUREMENT (qrate1; ptr-strategy design notes §17, `tools/harness/gates-qrate1.mjs`).
#
# A MEASUREMENT, not a gate: its rows are decision inputs — "the cell completed, twice equal" — and its verdict is a
# report. The gates of the same slice (the fixtures, the sub-goal seam, the q23 flip, the grep) run on every push in
# `sweep.yml`'s `qrate1` job.
#
# ⛔ DISPATCH-ONLY, with its OWN concurrency group (F1's ruling, 2026-09-21: measurement jobs never run on push; and
# measurements.yml's lesson: a group shared with the sweep lets a push cancel a campaign in flight). It is NOT in
# `measurements.yml` because that file holds the standing tables and costs ~5.5 runner-hours a dispatch; this one is
# a slice's own cells, run once to answer one question.
#
# TO RUN IT:  gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch>               (qrate1's cells)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=m28  (m28's legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=h22  (h22's legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=stages  (stages-1's legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=m30  (m30's legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=m31  (m31's levers + legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=shipq  (shipq-1's legs, below)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=whole  (whole-1: the chain in 8 segments + the page checks)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=climb  (climb-1: M01–M30 unchanged, the climb chain, the rows, the timeline)
#             gh workflow run qrate1.yml -R PeerInfinity/tmt-loader --ref <branch> -f part=climb2  (climb-2: the standing record's chain, one robustness cell)
# climb2 (tmt-climb-2, `gates-climb2.mjs`): the STANDING RECORD's own legs 36–65 (tools/harness/recorded/whole-ptr-130k.json,
# the shipped table with climb-1's stage off) replayed from its committed fixtures in 4 segments (`--part full`), and one
# robustness cell run again (`--part cell`, s90 × 4 by default) = tools/harness/recorded/climb2-robustness.json.
# climb (tmt-climb-1, `gates-climb.mjs`): the shipped table past M30 — `--part unchanged --seg k` (whole-1's legs to the M30
# leg replayed under the SHIPPED table: M01–M30 on whole-1's ticks and hashes), `--part full --seg k --segs 4` (the climb
# chain's own legs from its committed fixtures = tools/harness/recorded/whole-ptr-climb1.json), and the bounded parts
# (rows, switch, accept, timeline, grep) in one job.
# whole (tmt-whole-1, `gates-whole.mjs --part full --seg k --segs 8` and `--part page`): the whole-game run from a fresh save
# under the shipped table at diff 0.05, each segment from a committed whole/ fixture = the record (tools/harness/recorded/whole-ptr.json),
# every mark to the tick and the hash; the page from four checkpoints to the next mark, and a reload in the middle of the H22 queue.
# shipq (tmt-shipq-1, `gates-shipq.mjs --part leg`): the H22 attempt as the table's shipped QUEUE against the stage it
# replaced — the whole stretch from all/M26 under the shipped table (A@...) and under the table before that slice (ctl@...,
# snapshots/ptr/shipq/table-before-shipq.json), at diff 1 (to M30) and 0.05 (to M28 + M29), each twice (equal or RED);
# merge refuses a missing leg and adds the equality rows (the same ticks and hashes at each diff).
# m31 (tmt-m31-1, `gates-m31.mjs --part levers` and `--part leg`): toward M31 from stages/M30 — the M31 value goal's levers
# (total quirks >= 1e60: the q reset's gain, walked from the facts and measured over a held window), and the legs under the
# SHIPPED TABLE at diff 1 and 0.05 (A@...), the table BEFORE this slice (ctl@...) and the stage last (last@1), each twice
# (equal or RED); merge refuses a missing leg and adds the stage row.
# m30 (tmt-m30-1, `gates-m30.mjs --part leg`): M30 under the SHIPPED TABLE ALONE — the acceptance from stages/M28 at diff 1
# (A@1, which runs on to M33 to name the next wall) and at the page's diff 0.05 (A@0.05), and the whole stretch from
# all/M26 with q33-sg-unlock FIRST (first@1, shipped) and LAST (last@1) — each leg twice (equal or RED); merge refuses a
# missing leg and adds the order row.
# stages (tmt-stages-1, `gates-stages.mjs --part leg`): the whole stretch from all/M26 under the SHIPPED TABLE ALONE — the
# shipped stage order (A: H22 first) at diff 1 (on to M30 or its bound: the next stall; it writes the all/M28 + all/M29
# fixtures) and at the page's diff 0.05, and the other order (B: q31/q32 first, the table with its QL6 stages swapped,
# handed in with --auto-table) at diff 1 — each twice; the merge adds the order verdict.
# h22 (tmt-h22-1, `gates-h22.mjs --part leg`): M29 from m28/QL6 — the challenge-attempt template's verdict on H22 at that
# tick size (a check at diff 0.05 ticks ~40,000 copy-side ticks: past run.mjs's default 600-s boot limit, hence CI), then
# the queue it emitted played live until H22 is completed — twice.
# m28 (tmt-m28-1, `gates-m28.mjs --part leg`): each leg runs from m28/QL6 in stages — q31 bought, then q32 bought (M28)
# — twice; the qrate1 winner as it is, with challenge attempts held, at diff 1 and 0.05, and the planner on the
# template's sub-goal (q31 widened, q32 at the default options; with and without the challenge-hold candidate). It lives in THIS file because a new
# workflow cannot be dispatched before it exists on the default branch (qrate1's 404).
#
# The cells (each one job, each leg TWICE in parallel, the state log written and read back by rate.mjs):
#   control@1, q-w20@1                 the shipped table and the best non-rate-peak screen cell, QL5 → 308,372 total
#                                      quirks at diff 1 over a 150,000 game-s horizon (or how far by then)
#   q-rate-peak@1, q-rate-peak-bare@1  the winner (rate-peak@0/0 keeping the row cycle) and the table's bare alternative
#   control@0.05, q-rate-peak@0.05     the control and the winner at the PAGE's tick over 6,000 game-s (F1: no default
#                                      moves without a row at diff 0.05)
name: qrate1

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'qrate1 (the quirk-rate cells, the default), m28 (the legs toward q32; design notes §18), h22 (M29 at diff 1 and 0.05; §20), stages (M28 + M29 from all/M26 under the table alone; §21), m30 (M30 under the table alone, both stage orders) m31 (toward M31 from stages/M30: the levers and the legs) shipq (the H22 queue against the stage it replaced, diff 1 and 0.05), whole (whole-1: the whole-game chain from a fresh save at 0.05 in segments, and the real-page checks) climb (climb-1: M01–M30 unchanged under climb-1’s table, the climb chain past M30 in segments, the rows and the timeline) or climb2 (climb-2: the standing record’s chain in segments, one robustness cell again)'
        type: choice
        options: [qrate1, m28, h22, stages, m30, m31, shipq, whole, climb, climb2]
        default: qrate1
      leg:
        description: 'm28 / h22 / stages / m30 / m31 / shipq only: run just this leg (a key of gates-m28.mjs / gates-h22.mjs / gates-stages.mjs / gates-m30.mjs / gates-m31.mjs / gates-shipq.mjs LEGS); empty = every leg'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: qrate1-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.3'

jobs:
  screen:
    name: qrate1 — the screen (every candidate cell, 5,000 game-s, twice)
    if: ${{ inputs.part == 'qrate1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The screen
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-qrate1.mjs --part screen --pool 4 --assert | tee screen.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## qrate1 — the screen'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT)' screen.txt | cut -c1-700 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qrate1-screen
          path: tools/harness/results/tmp/gates-qrate1-part-screen-last.json
          if-no-files-found: warn
          retention-days: 14

  cells:
    name: qrate1 — cell ${{ matrix.cell }}
    if: ${{ inputs.part == 'qrate1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        cell: ['control@1', 'q-w20@1', 'q-rate-peak@1', 'q-rate-peak-bare@1', 'control@0.05', 'q-rate-peak@0.05']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The cell, twice
        shell: bash
        run: |
          set -o pipefail
          s=$(date +%s)
          node tools/harness/gates-qrate1.mjs --part cell --cell '${{ matrix.cell }}' --assert | tee cell.txt
          echo "TIME cell ${{ matrix.cell }}: $(( $(date +%s) - s )) s" | tee -a cell.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## qrate1 — ${{ matrix.cell }}'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' cell.txt | cut -c1-900 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name the artifact
        if: always()
        shell: bash
        run: echo "ART=qrate1-cell-$(echo '${{ matrix.cell }}' | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_ENV"
      - name: Upload the cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: tools/harness/results/tmp/qrate1-cell-*.json
          if-no-files-found: warn
          retention-days: 14

  planner:
    name: qrate1 — the planner on the sub-goal
    if: ${{ inputs.part == 'qrate1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The planner legs
        shell: bash
        run: |
          set -o pipefail
          s=$(date +%s)
          node tools/harness/gates-qrate1.mjs --part planner --assert | tee planner.txt
          echo "TIME planner: $(( $(date +%s) - s )) s" | tee -a planner.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## qrate1 — the planner'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' planner.txt | cut -c1-2000 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qrate1-planner
          path: tools/harness/results/tmp/gates-qrate1-part-planner-last.json
          if-no-files-found: warn
          retention-days: 14

  merge:
    name: qrate1 — merge (refuses a missing cell)
    needs: cells
    if: ${{ always() && inputs.part == 'qrate1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: qrate1-cell-*
          path: cells
      - name: Merge
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-qrate1.mjs --part merge --dir cells --assert | tee merge.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## qrate1 — merge'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT)' merge.txt | cut -c1-700 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  m28-legs:
    name: m28 — leg ${{ matrix.leg }}
    if: ${{ inputs.part == 'm28' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        leg: ['winner@1', 'winner-choff@1', 'winner-choff@0.05', 'winner@0.05', 'planner-wide@1', 'planner-wide-ch@1']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The leg, twice
        shell: bash
        run: |
          set -o pipefail
          if [ -n '${{ inputs.leg }}' ] && [ '${{ inputs.leg }}' != '${{ matrix.leg }}' ]; then echo 'SKIPPED: not the requested leg' | tee leg.txt; exit 0; fi
          s=$(date +%s)
          node tools/harness/gates-m28.mjs --part leg --leg '${{ matrix.leg }}' --assert | tee leg.txt
          echo "TIME leg ${{ matrix.leg }}: $(( $(date +%s) - s )) s" | tee -a leg.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## m28 — ${{ matrix.leg }}'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' leg.txt | cut -c1-3000 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name the artifact
        if: always()
        shell: bash
        run: echo "ART=m28-leg-$(echo '${{ matrix.leg }}' | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_ENV"
      - name: Upload the leg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: tools/harness/results/tmp/m28-leg-*.json
          if-no-files-found: warn
          retention-days: 14

  m28-merge:
    name: m28 — merge (refuses a missing leg)
    needs: m28-legs
    if: ${{ always() && inputs.part == 'm28' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: m28-leg-*
          path: legs
      - name: Merge
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-m28.mjs --part merge --dir legs ${{ inputs.leg != '' && format('--only ''{0}''', inputs.leg) || '' }} --assert | tee merge.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## m28 — merge'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT)' merge.txt | cut -c1-1500 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  h22-legs:
    name: h22 — leg ${{ matrix.leg }}
    if: ${{ inputs.part == 'h22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        leg: ['m29@1', 'm29@0.05', 'table@1', 'table@0.05']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The leg, twice
        shell: bash
        run: |
          set -o pipefail
          if [ -n '${{ inputs.leg }}' ] && [ '${{ inputs.leg }}' != '${{ matrix.leg }}' ]; then echo 'SKIPPED: not the requested leg' | tee leg.txt; exit 0; fi
          s=$(date +%s)
          node tools/harness/gates-h22.mjs --part leg --leg '${{ matrix.leg }}' --assert | tee leg.txt
          echo "TIME leg ${{ matrix.leg }}: $(( $(date +%s) - s )) s" | tee -a leg.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## h22 — ${{ matrix.leg }}'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' leg.txt | cut -c1-3000 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name the artifact
        if: always()
        shell: bash
        run: echo "ART=h22-leg-$(echo '${{ matrix.leg }}' | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_ENV"
      - name: Upload the leg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: tools/harness/results/tmp/h22-leg-*.json
          if-no-files-found: warn
          retention-days: 14

  h22-merge:
    name: h22 — merge (refuses a missing leg)
    needs: h22-legs
    if: ${{ always() && inputs.part == 'h22' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: h22-leg-*
          path: legs
      - name: Merge
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-h22.mjs --part merge --dir legs ${{ inputs.leg != '' && format('--only ''{0}''', inputs.leg) || '' }} --assert | tee merge.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## h22 — merge'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT)' merge.txt | cut -c1-1500 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  stages-legs:
    name: stages — leg ${{ matrix.leg }}
    if: ${{ inputs.part == 'stages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        leg: ['A@1', 'B@1', 'A@0.05']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The leg, twice
        shell: bash
        run: |
          set -o pipefail
          if [ -n '${{ inputs.leg }}' ] && [ '${{ inputs.leg }}' != '${{ matrix.leg }}' ]; then echo 'SKIPPED: not the requested leg' | tee leg.txt; exit 0; fi
          s=$(date +%s)
          node tools/harness/gates-stages.mjs --part leg --leg '${{ matrix.leg }}' --assert | tee leg.txt
          echo "TIME leg ${{ matrix.leg }}: $(( $(date +%s) - s )) s" | tee -a leg.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## stages — ${{ matrix.leg }}'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' leg.txt | cut -c1-3000 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name the artifact
        if: always()
        shell: bash
        run: echo "ART=stages-leg-$(echo '${{ matrix.leg }}' | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_ENV"
      - name: Upload the leg (its row file and the snapshots it wrote)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: |
            tools/harness/results/tmp/stages-leg-*.json
            tools/harness/results/tmp/stages-leg-*/
          if-no-files-found: warn
          retention-days: 14

  stages-merge:
    name: stages — merge (refuses a missing leg)
    needs: stages-legs
    if: ${{ always() && inputs.part == 'stages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: stages-leg-*
          path: legs
      - name: Merge
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-stages.mjs --part merge --dir legs ${{ inputs.leg != '' && format('--only ''{0}''', inputs.leg) || '' }} --assert | tee merge.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## stages — merge'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT)' merge.txt | cut -c1-1500 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  m30-legs:
    name: m30 — leg ${{ matrix.leg }}
    if: ${{ inputs.part == 'm30' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        leg: ['A@1', 'A@0.05', 'first@1', 'last@1']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The leg, twice
        shell: bash
        run: |
          set -o pipefail
          if [ -n '${{ inputs.leg }}' ] && [ '${{ inputs.leg }}' != '${{ matrix.leg }}' ]; then echo 'SKIPPED: not the requested leg' | tee leg.txt; exit 0; fi
          s=$(date +%s)
          node tools/harness/gates-m30.mjs --part leg --leg '${{ matrix.leg }}' --assert | tee leg.txt
          echo "TIME leg ${{ matrix.leg }}: $(( $(date +%s) - s )) s" | tee -a leg.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## m30 — ${{ matrix.leg }}'; echo ''; echo '```'; grep -aE '^(GREEN|RED|VERDICT|TIME)' leg.txt | cut -c1-3000 || echo 'no output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name the artifact
        if: always()
        shell: bash
        run: echo "ART=m30-leg-$(echo '${{ matrix.leg }}' | tr -c 'A-Za-z0-9.-' '_')" >> "$GITHUB_ENV"
      - name: Upload the leg (its row file and the snapshots it wrote)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: |
            tools/harness/results/tmp/m30-leg-*.json
            tools/harness/results/tmp/m30-leg-*/
          if-no-files-found: warn
          retention-days: 14

  m30-merge:
    name: m30 — merge (refuses a missing leg)
    needs: m30-legs
    if: ${{ always() && inputs.part == 'm30' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: m30-leg-*
          path: legs
      - name: Merge
        shell: bash
        run: |
          set -o pipefail
          node tools/harness/gates-m30.mjs --part merge --dir legs ${{ inputs.leg != '' && format('--only ''{0}''', inputs.leg) || '' }} --assert | tee merge.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
