        shell: bash
        run: |
          set -o pipefail
          if [ -n '${{ inputs.leg }}' ] && [ '${{ inputs.leg }}' != '${{ matrix.leg }}' ]; then echo 'SKIPPED: not the requested leg' | tee leg.txt; exit 0; fi
          s=$(date +%s)
          node tools/harness/gates-m31.mjs --part leg --leg '${{ matrix.leg }}' --assert | tee leg.txt
